display_information:
  name: Hive
  description: Notifications from your Claude Code sessions in Hive
  background_color: "#1a1400"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Hive
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - im:read
      - im:write
      - users:read
    # Optional: lets Hive's assistant watch your DMs and @mentions (read-only, as you).
    user:
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.im
    user_events:
      - message.im
      - message.mpim
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
